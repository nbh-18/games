<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stapeln</title>
<link rel="stylesheet" href="base.css">
<style>#cv{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud"><span id="sc">0</span><span class="m" id="bs"></span></div>
<script src="game.js"></script>
<script>
G.setup({title:"Stapeln",rules:"Tippe, um den Block abzusetzen. Was übersteht, wird abgeschnitten. Baue den Turm so hoch du kannst.",key:"game:stapeln:best",fmt:function(v){return v+" Blöcke"}});
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),sc=document.getElementById("sc");
var W=0,H=0,bh=20,tower=[],cur=null,cam=0,fall=[],run=false,last=0,score=0,bg="#101215";
function fit(){var d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;bh=Math.max(18,Math.min(30,Math.min(W,H)*0.07));cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(!run)draw()}
function newCur(){var t=tower[tower.length-1],v=Math.min(W*1.7,W*(0.55+0.035*tower.length)),s=Math.random()<0.5?1:-1;cur={x:s>0?0:W-t.w,w:t.w,v:v*s}}
function yOf(i){return H*0.82-(i-cam)*bh}
function begin(){bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||bg;tower=[{x:W*0.25,w:W*0.5}];score=0;sc.textContent="0";cam=0;fall=[];newCur();run=true;last=0;requestAnimationFrame(loop)}
function drop(){
  var t=tower[tower.length-1],l=Math.max(cur.x,t.x),r=Math.min(cur.x+cur.w,t.x+t.w),o=r-l;
  if(o<=2){run=false;draw();G.end(score,"");return}
  if(Math.abs(cur.x-t.x)<5){l=t.x;o=t.w}
  else{var cx=cur.x<t.x?cur.x:t.x+t.w;fall.push({x:cx,w:cur.w-o,lvl:tower.length,dy:0,vy:0})}
  tower.push({x:l,w:o});score++;sc.textContent=score;newCur();
}
function loop(ts){
  if(!run)return;var dt=last?Math.min(0.05,(ts-last)/1000):0;last=ts;
  cur.x+=cur.v*dt;if(cur.x<0){cur.x=0;cur.v=-cur.v}if(cur.x+cur.w>W){cur.x=W-cur.w;cur.v=-cur.v}
  var ct=Math.max(0,tower.length-5);cam+=(ct-cam)*Math.min(1,dt*6);
  fall.forEach(function(f){f.vy+=H*2*dt;f.dy+=f.vy*dt});fall=fall.filter(function(f){return f.dy<H});
  draw();requestAnimationFrame(loop);
}
function col(i){return "hsl("+(i*17%360)+",60%,55%)"}
function draw(){
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  tower.forEach(function(b,i){ctx.fillStyle=col(i);ctx.fillRect(b.x,yOf(i),b.w,bh-1)});
  fall.forEach(function(f){ctx.fillStyle=col(f.lvl-1);ctx.fillRect(f.x,yOf(f.lvl-1)+f.dy,f.w,bh-1)});
  if(run&&cur){ctx.fillStyle=col(tower.length);ctx.fillRect(cur.x,yOf(tower.length),cur.w,bh-1)}
}
cv.addEventListener("pointerdown",function(e){if(run){e.preventDefault();drop()}});
window.addEventListener("resize",fit);
G.onStart(begin);fit();
</script>
</body>
</html>
