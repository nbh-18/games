<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To Do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>To Do List</title>
<style>
:root{--bg:#f3f1ec;--card:#fffdf9;--ink:#1f2a37;--mute:#7b8591;--line:#e1ddd3;--accent:#2f6f5e;--accent-ink:#fff;--miss:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1c2229;--ink:#e8ecf0;--mute:#8a95a1;--line:#2b333c;--accent:#5fb89f;--accent-ink:#10231e;--miss:#ef6b6b}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1c2229;--ink:#e8ecf0;--mute:#8a95a1;--line:#2b333c;--accent:#5fb89f;--accent-ink:#10231e;--miss:#ef6b6b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent;min-height:100%;overflow-x:hidden}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 14px;letter-spacing:-.01em;text-align:center}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:inherit;font-weight:600}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.col{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.col.today{border-color:var(--accent);border-width:2px}
.col h2{margin:0;font-size:1.15rem}
.col .date{color:var(--mute);font-size:.9rem;margin:2px 0 10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.chk{flex:none;width:44px;height:44px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ring svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
li.done .ring{background:var(--accent);border-color:var(--accent)}
li.done .ring svg{opacity:1}
li.done .txt{color:var(--mute);text-decoration:line-through}
li.miss .ring{border-color:var(--miss)}
li.miss .txt{color:var(--miss)}
.txt{flex:1;min-width:0;padding:10px 0;overflow-wrap:anywhere}
.del{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--mute);font-size:1.3rem}
.empty,.note{color:var(--mute);padding:12px 0;font-size:.95rem}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit}
.add button{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:560px;margin:0 auto 14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{margin:0;font-size:1.15rem}
.calhead button{width:44px;height:44px;border:0;border-radius:12px;background:var(--line);color:var(--ink);font-size:1.2rem}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;color:var(--mute);font-size:.8rem;padding:2px 0}
.cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.95rem;background:var(--bg);color:var(--ink);position:relative}
.cell.none{background:transparent}
.cell.today{outline:3px solid var(--ink);outline-offset:1px}
.cell.fut::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.legend{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mute);font-size:.8rem}
.legend i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(0 60% 42%),hsl(60 60% 42%),hsl(120 60% 42%))}
.panel h2{margin:0 0 4px;font-size:1.15rem}
li.rli{flex-wrap:wrap}
.hist{flex:0 0 100%;display:flex;gap:9px;align-items:flex-end;padding:0 0 12px 2px;color:var(--mute);font-size:.72rem}
.hd{display:flex;flex-direction:column;align-items:center;gap:3px}
.hd i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.hd i.ok{background:var(--accent)}
.hd i.miss{background:var(--miss)}
.hd i.open{background:transparent;border:2px solid var(--mute)}
.hd i.na{background:transparent;border:1px dashed var(--line)}
.streak{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--accent)}
button.cell{border:0;padding:0;font:inherit;cursor:pointer}
.cell.sel{box-shadow:0 0 0 3px var(--accent)}
.colhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:0;background:transparent;color:inherit;font:inherit;padding:0;text-align:left}
.colhead .sum{flex:1;text-align:right;font-size:.85rem;color:var(--mute)}
.sum.bad{color:var(--miss)}.sum.good{color:var(--accent)}
.chev{flex:none;color:var(--mute);transition:transform .15s}
.col.shut .chev{transform:rotate(-90deg)}
.sline{text-align:center;color:var(--mute);font-size:.9rem;margin:0 0 14px}
.sline b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fnote{margin-top:10px;font-size:.85rem;color:var(--accent);font-weight:600}
.add .addbtn{flex:1;text-align:left;background:transparent;color:var(--accent);border:1px dashed var(--line)}
.add.open{flex-wrap:wrap}
.add.open input{flex:1 0 100%}
.add.open button{flex:1}
.add .ghost{background:var(--line);color:var(--ink)}
li.ask .yes,li.ask .no{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:12px;font:inherit;font-weight:600}
li.ask .yes{background:var(--miss);color:#fff}
li.ask .no{background:var(--line);color:var(--ink)}
.add.open .tl{flex:1 0 100%;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.9rem}
.add.open .tl input{flex:1}
.tm{flex:none;min-width:3.2em;font-size:.85rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
li.skip .txt{color:var(--mute);text-decoration:line-through;font-style:italic}
li.skip .ring{border-style:dashed}
li.edit{flex-wrap:wrap;gap:8px;padding:10px 0}
li.edit>input,li.edit .tl input{min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit}
li.edit>input{flex:1 0 100%}
li.edit .tl{flex:1 0 100%;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.9rem}
li.edit .tl input{flex:1}
.erow{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:8px}
.erow button{flex:1 1 40%;min-height:44px;border:0;border-radius:12px;font:inherit;font-weight:600;background:var(--line);color:var(--ink)}
.erow .pri{background:var(--accent);color:var(--accent-ink)}
.erow .dng{background:transparent;color:var(--miss);border:1px solid var(--miss)}
.hd i.skp{background:transparent;border:2px dashed var(--mute)}
.bk{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:8px;margin:8px 0}
.sech{max-width:560px;margin:20px auto 8px;font-size:1.15rem}
.tag{flex:none;font-size:.7rem;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:8px}
@media (max-width:759px){.col.shut .body{display:none}.col.shut{padding-top:4px;padding-bottom:4px}}
@media (min-width:760px){.cols{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.chev{display:none}}
</style>
</head>
<body>
<main>
<h1>To Do List</h1>
<div class="seg" id="nav" role="tablist"></div>
<div id="sline" class="sline"></div>
<div id="view"></div>
</main>
<script>
var NAMES=["Gestern","Heute","Morgen"], OFFS=[-1,0,1], view="tage", calOff=0, baseKey="", selDay=null, calFilter="all";
function pad(n){return n<10?"0"+n:""+n}
function dateOff(off){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function keyFor(off){return keyOf(dateOff(off))}
function labelFor(off){return dateOff(off).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
function rd(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){return rd("todo:"+k,[])}
function save(k,l){wr("todo:"+k,l)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function isWE(d){var g=d.getDay();return g===0||g===6}
function routines(){var r=rd("routine:v1",null);return r||{wk:[],we:[]}}
 
function newId(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function eachDay(fn){
  try{for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(key.indexOf("todo:")!==0)continue;
    var l=rd(key,[]);if(fn(l,key.slice(5)))localStorage.setItem(key,JSON.stringify(l))}}catch(e){}
}
// Alte Routinen (nur Text) bekommen eine ID; alte Tageseinträge werden zugeordnet
function migrate(){
  try{
    if(localStorage.getItem("mig:v2"))return;
    var q=rd("routine:v1",null)||{wk:[],we:[]};
    ["wk","we"].forEach(function(ty){q[ty]=(q[ty]||[]).map(function(x){return typeof x==="string"?{id:newId(),t:x}:x})});
    wr("routine:v1",q);
    eachDay(function(l,day){
      var we=isWE(new Date(day+"T12:00:00")),a=q[we?"we":"wk"],b=q[we?"wk":"we"],ch=false;
      l.forEach(function(o){
        if(o.r&&!o.rid){
          var m=a.filter(function(x){return x.t===o.t})[0]||b.filter(function(x){return x.t===o.t})[0];
          if(m){o.rid=m.id;ch=true}
        }
      });
      return ch;
    });
    localStorage.setItem("mig:v2","1");
  }catch(e){}
}
function renameRoutine(id,t){
  var q=routines();["wk","we"].forEach(function(ty){q[ty].forEach(function(x){if(x.id===id)x.t=t})});
  wr("routine:v1",q);
  eachDay(function(l){var ch=false;l.forEach(function(o){if(o.rid===id){o.t=t;ch=true}});return ch});
}
// Routinen für heute und morgen einmalig eintragen
function seed(){
  var r=routines();
  [0,1].forEach(function(off){
    var k=keyFor(off);
    if(rd("seed:"+k,0))return;
    var items=isWE(dateOff(off))?r.we:r.wk, list=load(k);
    items.forEach(function(x){list.push({t:x.t,d:false,r:1,rid:x.id})});
    save(k,list);wr("seed:"+k,1);
  });
}
function addRoutine(type,t){
  var r=routines(),rt={id:newId(),t:t};r[type].push(rt);wr("routine:v1",r);
  [0,1].forEach(function(off){
    if((isWE(dateOff(off))?"we":"wk")!==type)return;
    var k=keyFor(off),l=load(k);l.push({t:t,d:false,r:1,rid:rt.id});save(k,l);
  });
}
function addForm(label,onAdd,ph,withTime){
  var f=el("div","add"),o=el("button","addbtn","+ "+ph);
  o.setAttribute("aria-label",label);
  o.onclick=function(){
    f.innerHTML="";f.className="add open";
    var inp=el("input"),tm=null,lb=null;
    inp.type="text";inp.placeholder=ph;inp.maxLength=120;inp.setAttribute("aria-label",label);
    if(withTime){lb=el("label","tl","Uhrzeit (optional)");tm=el("input");tm.type="time";lb.appendChild(tm)}
    var ok=el("button",null,"Speichern"),no=el("button","ghost","Abbrechen");
    function go(){var v=inp.value.trim();if(v)onAdd(v,tm?tm.value:"")}
    ok.onclick=go;no.onclick=function(){render()};
    inp.onkeydown=function(e){if(e.key==="Enter")go();if(e.key==="Escape")render()};
    f.appendChild(inp);if(lb)f.appendChild(lb);f.appendChild(ok);f.appendChild(no);inp.focus();
  };
  f.appendChild(o);return f;
}
function sorted(l){return l.slice().sort(function(a,b){return (a.h?0:1)-(b.h?0:1)||(a.h&&b.h?(a.h<b.h?-1:a.h>b.h?1:0):0)})}
function askDel(li,msg,onYes){
  li.innerHTML="";li.className="ask";
  li.appendChild(el("span","txt",msg));
  var y=el("button","yes","Löschen"),n=el("button","no","Nein");
  y.onclick=onYes;n.onclick=function(){render()};
  li.appendChild(y);li.appendChild(n);
}
function isDone(o){return o.d}
function notSkip(o){return !o.s}
function dayOk(off){var l=load(keyFor(off)).filter(notSkip);return l.length>0&&l.every(isDone)}
function dayStreak(){var n=0;for(var o=0;o>-400;o--){var ok=dayOk(o);if(o===0&&!ok)continue;if(ok)n++;else break}return n}
function bestStreak(){var best=0,cur=0;for(var o=-400;o<=0;o++){if(dayOk(o)){cur++;if(cur>best)best=cur}else cur=0}return best}
function nextKey(k){var d=new Date(k+"T12:00:00");d.setDate(d.getDate()+1);return keyOf(d)}
function editRow(li,item,k,list){
  li.innerHTML="";li.className="edit";
  var inp=el("input"),tm=null,tk=keyFor(0);
  inp.type="text";inp.value=item.t;inp.maxLength=120;inp.setAttribute("aria-label","Name");
  li.appendChild(inp);
  if(item.e){var lb=el("label","tl","Uhrzeit");tm=el("input");tm.type="time";tm.value=item.h||"";lb.appendChild(tm);li.appendChild(lb)}
  var row=el("div","erow");
  function btn(txt,cls,fn){var b=el("button",cls,txt);b.onclick=fn;row.appendChild(b)}
  function saveIt(){
    var v=inp.value.trim();if(!v)return;
    if(item.rid)renameRoutine(item.rid,v);
    else{item.t=v;if(tm){if(tm.value)item.h=tm.value;else delete item.h}save(k,list)}
    render();
  }
  btn("Speichern","pri",saveIt);
  if(item.r)btn(item.s?"Wieder aktiv":(k===tk?"Heute auslassen":"Auslassen"),"",function(){item.s=!item.s;save(k,list);render()});
  else if(!item.e&&!item.d)btn(k===tk?"Auf morgen verschieben":"Einen Tag später","",function(){var nk=nextKey(k),nl=load(nk);save(k,list.filter(function(o){return o!==item}));nl.push(item);save(nk,nl);render()});
  btn("Löschen","dng",function(){askDel(li,item.r?"Nur an diesem Tag entfernen? Die Routine bleibt.":"Wirklich löschen?",function(){save(k,list.filter(function(o){return o!==item}));render()})});
  btn("Abbrechen","",function(){render()});
  li.appendChild(row);
  inp.onkeydown=function(e){if(e.key==="Enter")saveIt();if(e.key==="Escape")render()};
  inp.focus();
}
function editRoutine(li,rt,type){
  li.innerHTML="";li.className="edit";
  var inp=el("input");inp.type="text";inp.value=rt.t;inp.maxLength=120;inp.setAttribute("aria-label","Name der Routine");
  li.appendChild(inp);
  var row=el("div","erow");
  function btn(txt,cls,fn){var b=el("button",cls,txt);b.onclick=fn;row.appendChild(b)}
  function saveIt(){var v=inp.value.trim();if(!v)return;renameRoutine(rt.id,v);render()}
  btn("Speichern","pri",saveIt);
  btn("Löschen","dng",function(){askDel(li,"Routine wirklich löschen?",function(){var q=routines();q[type]=q[type].filter(function(x){return x.id!==rt.id});wr("routine:v1",q);render()})});
  btn("Abbrechen","",function(){render()});
  li.appendChild(row);
  inp.onkeydown=function(e){if(e.key==="Enter")saveIt();if(e.key==="Escape")render()};
  inp.focus();
}
function exportData(){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^(todo|routine|seed):/.test(k))o[k]=localStorage.getItem(k)}return JSON.stringify({app:"todo",v:2,data:o})}
function importData(txt){
  var o;try{o=JSON.parse(txt.trim())}catch(e){return "Das ist keine gültige Sicherung."}
  if(!o||o.app!=="todo"||!o.data)return "Das ist keine gültige Sicherung.";
  var keys=Object.keys(o.data);
  if(!keys.length||!keys.every(function(k){return /^(todo|routine|seed):/.test(k)}))return "Die Sicherung enthält unerwartete Daten.";
  try{keys.forEach(function(k){JSON.parse(o.data[k])})}catch(e){return "Die Sicherung ist beschädigt."}
  if(!confirm("Das ersetzt alle aktuellen Daten auf diesem Gerät. Fortfahren?"))return "Abgebrochen.";
  try{
    var old=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^(todo|routine|seed|mig):/.test(k))old.push(k)}
    old.forEach(function(k){localStorage.removeItem(k)});
    keys.forEach(function(k){localStorage.setItem(k,String(o.data[k]))});
    migrate();
  }catch(e){return "Wiederherstellen ist fehlgeschlagen."}
  alert("Wiederhergestellt.");location.reload();return "";
}
function renderBackup(box){
  var p=el("div","panel");p.appendChild(el("h2",null,"Sicherung"));
  p.appendChild(el("div","note","Deine Daten liegen nur auf diesem Gerät. Sichere sie ab und zu, vor allem bevor du die App löschst. Text in Notizen oder einer Mail an dich selbst aufbewahren."));
  var ta=el("textarea","bk");ta.placeholder="Hier erscheint die Sicherung. Zum Wiederherstellen den gesicherten Text hier einfügen.";
  var msg=el("div","note",""),row=el("div","erow");
  var b1=el("button","pri","Sicherung erstellen"),b2=el("button",null,"Wiederherstellen");
  b1.onclick=function(){
    ta.value=exportData();ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}
    var fail=function(){msg.textContent="Markiere den Text und kopiere ihn von Hand."};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Kopiert. Füge den Text jetzt in Notizen oder eine Mail an dich selbst ein."},fail);else fail();
  };
  b2.onclick=function(){msg.textContent=importData(ta.value)};
  row.appendChild(b1);row.appendChild(b2);
  p.appendChild(ta);p.appendChild(row);p.appendChild(msg);box.appendChild(p);
}
var shut={"-1":true,"0":false,"1":true};
function renderTage(box){
  OFFS.forEach(function(off,i){
    var k=keyFor(off), list=load(k), locked=off<0;
    var col=el("section","col"+(off===0?" today":"")+(shut[off]?" shut":""));
    var act=list.filter(notSkip), done=act.filter(isDone).length, open=act.length-done, sm, cls="";
    if(off<0){
      if(!list.length)sm="nichts eingetragen";
      else if(open>0){sm=open+" offen";cls=" bad"}
      else{sm="alles erledigt";cls=" good"}
    }else if(off===0)sm=act.length?done+"/"+act.length+" erledigt":(list.length?"alles ausgelassen":"noch nichts");
    else sm=list.length?list.length+" geplant":"nichts geplant";
    var hd=el("button","colhead");hd.setAttribute("aria-expanded",!shut[off]);
    hd.appendChild(el("h2",null,NAMES[i]));hd.appendChild(el("span","sum"+cls,sm));hd.appendChild(el("span","chev","▾"));
    hd.onclick=function(){shut[off]=!shut[off];render()};
    col.appendChild(hd);
    var body=el("div","body");
    body.appendChild(el("div","date",labelFor(off)));
    var ul=el("ul");
    if(!list.length)ul.appendChild(el("div","empty",locked?"Nichts eingetragen.":"Noch nichts eingetragen."));
    sorted(list).forEach(function(item){
      var li=el("li",item.s?"skip":(item.d?"done":(locked?"miss":"")));
      var b=el("button","chk");b.setAttribute("aria-label",(item.d?"Erledigt: ":"Offen: ")+item.t);
      b.innerHTML='<span class="ring"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>';
      if(locked||item.s)b.disabled=true;else b.onclick=function(){item.d=!item.d;save(k,list);render()};
      li.appendChild(b);if(item.h)li.appendChild(el("span","tm",item.h));li.appendChild(el("span","txt",item.t));if(item.e)li.appendChild(el("span","tag","Termin"));
      if(item.s)li.appendChild(el("span","tag","ausgelassen"));
      if(!locked){
        var x=el("button","del","✎");x.setAttribute("aria-label","Bearbeiten: "+item.t);
        x.onclick=function(){editRow(li,item,k,list)};
        li.appendChild(x);
      }
      ul.appendChild(li);
    });
    body.appendChild(ul);
    if(locked)body.appendChild(el("div","note","Gestern ist abgeschlossen. Offenes bleibt rot."));
    else body.appendChild(addForm("Neue Aufgabe für "+NAMES[i],function(v){list.push({t:v,d:false});save(k,list);render()},"Neue Aufgabe"));
    col.appendChild(body);box.appendChild(col);
  });
  box.className="cols";
}
 
function renderCal(box){
  var opts=[["all","Alle"],["day","Tage"],["rou","Routinen"]];
  if(!opts.some(function(o){return o[0]===calFilter}))calFilter="all";
  function filt(l){
    if(calFilter==="rou")return l.filter(function(o){return o.r});
    if(calFilter==="day")return l.filter(function(o){return !o.r});
    return l;
  }
  var now=new Date(),base=new Date(now.getFullYear(),now.getMonth()+calOff,1,12);
  var y=base.getFullYear(),m=base.getMonth(),days=new Date(y,m+1,0).getDate();
  var lead=(base.getDay()+6)%7, todayKey=keyOf(now);
  var p=el("div","panel"),h=el("div","calhead");
  var pv=el("button",null,"‹"),nx=el("button",null,"›");
  pv.setAttribute("aria-label","Vorheriger Monat");nx.setAttribute("aria-label","Nächster Monat");
  pv.onclick=function(){calOff--;render()};nx.onclick=function(){calOff++;render()};
  h.appendChild(pv);h.appendChild(el("h2",null,base.toLocaleDateString("de-DE",{month:"long",year:"numeric"})));h.appendChild(nx);
  p.appendChild(h);
  if(true){
    var ch=el("div","chips");
    opts.forEach(function(o){var b=el("button",null,o[1]);b.setAttribute("aria-pressed",calFilter===o[0]);b.onclick=function(){calFilter=o[0];render()};ch.appendChild(b)});
    p.appendChild(ch);
  }
  var g=el("div","grid7");
  ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(function(w){g.appendChild(el("div","wd",w))});
  for(var i=0;i<lead;i++)g.appendChild(el("div","cell none"));
  for(var d=1;d<=days;d++){
    var dt=new Date(y,m,d,12),k=keyOf(dt),list=filt(load(k)).filter(notSkip),c=el("button","cell",d);
    c.onclick=(function(kk){return function(){selDay=(selDay===kk?null:kk);render()}})(k);
    if(k===selDay)c.classList.add("sel");
    if(k===todayKey)c.classList.add("today");
    if(list.length){
      if(k<=todayKey){
        var r=list.filter(function(o){return o.d}).length/list.length;
        c.style.background="hsl("+Math.round(r*120)+" 60% 42%)";c.style.color="#fff";
      }else c.classList.add("fut");
    }
    g.appendChild(c);
  }
  p.appendChild(g);
  var lg=el("div","legend");lg.appendChild(el("span",null,"0 %"));lg.appendChild(el("i"));lg.appendChild(el("span",null,"100 % erledigt"));
  p.appendChild(lg);
  box.appendChild(p);
  if(selDay){
    var q=el("div","panel"),sl=load(selDay),past=selDay<todayKey;
    q.appendChild(el("h2",null,new Date(selDay+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})));
    var u=el("ul");
    if(!sl.length)u.appendChild(el("div","empty","Nichts eingetragen."));
    sorted(sl).forEach(function(o){
      var li=el("li",o.s?"skip":(o.d?"done":(past?"miss":"")));
      var rg=el("span","chk");rg.innerHTML='<span class="ring"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>';
      li.appendChild(rg);if(o.h)li.appendChild(el("span","tm",o.h));li.appendChild(el("span","txt",o.t));if(o.r)li.appendChild(el("span","tag","Routine"));if(o.e)li.appendChild(el("span","tag","Termin"));
      if(!past){var xd=el("button","del","✎");xd.setAttribute("aria-label","Bearbeiten: "+o.t);xd.onclick=function(){editRow(li,o,selDay,sl)};li.appendChild(xd)}
      u.appendChild(li);
    });
    q.appendChild(u);
    if(!past)q.appendChild(addForm("Termin hinzufügen",function(v,h){var l2=load(selDay),n={t:v,d:false,e:1};if(h)n.h=h;l2.push(n);save(selDay,l2);render()},"Neuer Termin",true));
    box.appendChild(q);
  }
  box.appendChild(el("h2","sech","Routinen"));renderRoutine(box);renderBackup(box);
}
 
function routineHist(rid,type){
  var wrap=el("div","hist"),L=["S","M","D","M","D","F","S"];
  function find(off){return load(keyFor(off)).filter(function(o){return o.rid===rid})[0]}
  function applies(off){return (isWE(dateOff(off))?"we":"wk")===type}
  for(var off=-6;off<=0;off++){
    var cls="none";
    if(!applies(off))cls="na";
    else{var it=find(off);if(it)cls=it.s?"skp":(it.d?"ok":(off===0?"open":"miss"))}
    var c=el("div","hd");c.appendChild(el("i",cls));c.appendChild(el("span",null,L[dateOff(off).getDay()]));wrap.appendChild(c);
  }
  var n=0;
  for(var o=0;o>-120;o--){
    if(!applies(o))continue;
    var it2=find(o),dn=!!(it2&&it2.d);
    if(it2&&it2.s)continue;
    if(o===0&&!dn)continue;
    if(dn)n++;else break;
  }
  if(n>0)wrap.appendChild(el("span","streak",n+(n===1?" Tag":" Tage")+" am Stück"));
  return wrap;
}
function renderRoutine(box){
  var r=routines();
  [["wk","Werktage (Mo–Fr)"],["we","Wochenende (Sa, So)"]].forEach(function(s){
    var p=el("div","panel");p.appendChild(el("h2",null,s[1]));
    var ul=el("ul");
    if(!r[s[0]].length)ul.appendChild(el("div","empty","Noch keine Routine."));
    r[s[0]].forEach(function(rt){
      var li=el("li","rli");li.appendChild(el("span","txt",rt.t));
      var x=el("button","del","✎");x.setAttribute("aria-label","Bearbeiten: "+rt.t);
      x.onclick=function(){editRoutine(li,rt,s[0])};
      li.appendChild(x);li.appendChild(routineHist(rt.id,s[0]));ul.appendChild(li);
    });
    p.appendChild(ul);
    p.appendChild(addForm("Neue Routine für "+s[1],function(v){addRoutine(s[0],v);render()},"Neue Routine"));
    box.appendChild(p);
  });
  box.appendChild(el("div","note","Routinen landen automatisch in Heute und Morgen. Umbenennen behält die Serie. Gelöschte Routinen entfernen bereits eingetragene Aufgaben nicht."));
  box.className="";
}
 
function render(){
  baseKey=keyFor(0);seed();
  var nav=document.getElementById("nav"),box=document.getElementById("view"),sl=document.getElementById("sline");
  nav.innerHTML="";box.innerHTML="";sl.innerHTML="";
  [["kal","Kalender"],["tage","Tage"]].forEach(function(v){
    var b=el("button",null,v[1]);b.setAttribute("role","tab");b.setAttribute("aria-selected",view===v[0]);
    b.onclick=function(){view=v[0];render()};nav.appendChild(b);
  });
  var cur=dayStreak(),best=bestStreak();
  if(!best)sl.textContent="Noch keine Serie. Erledige einen ganzen Tag komplett.";
  else{sl.appendChild(document.createTextNode("Serie: "));sl.appendChild(el("b",null,cur+(cur===1?" Tag":" Tage")));sl.appendChild(document.createTextNode(" · Rekord "+best))}
  if(view==="tage")renderTage(box);else{box.className="";renderCal(box)}
}
function checkDay(){if(keyFor(0)!==baseKey)render()}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkDay()});
setInterval(checkDay,60000);
migrate();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
