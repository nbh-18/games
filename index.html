<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<link rel="stylesheet" href="base.css">
<style>
main{max-width:640px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em}
.lead{text-align:center;color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-height:160px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:inherit;text-decoration:none}
.tile .ic{font-size:2rem;line-height:1}
.tile b{font-size:1.1rem}
.tile span.d{color:var(--mute);font-size:.9rem}
.tile .rec{margin-top:auto;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;color:var(--accent)}
.tile.soon{opacity:.55}
.note{text-align:center;color:var(--mute);font-size:.8rem;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Games</h1>
<p class="lead">Wähle ein Spiel</p>
<div class="grid" id="grid"></div>
<p class="note">Rekorde liegen nur auf diesem Gerät.</p>
</main>
<script>
// Adresse des F1-Spiels (anpassen, falls dein Repo anders heißt)
var F1_URL="https://nbh-18.github.io/f1-start/";
var GAMES=[
  {t:"F1 Start",d:"Reagiere, sobald die Lichter ausgehen.",i:"🏁",u:F1_URL,k:"f1:best",f:function(v){return v+" ms"}},
  {t:"Ausweichen",d:"Weiche den fallenden Steinen aus.",i:"☄️",u:"ausweichen.html",k:"game:ausweichen:best",f:function(v){return v.toFixed(1)+" s"}},
  {t:"Zielen",d:"Tippe die Ziele, bevor sie verschwinden.",i:"🎯",u:"zielen.html",k:"game:zielen:best",f:function(v){return v+" Pkt"}}
];
function best(k){try{var v=parseFloat(localStorage.getItem(k));return v>0?v:0}catch(e){return 0}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var grid=document.getElementById("grid");
GAMES.forEach(function(g){
  var a=el(g.soon?"div":"a","tile"+(g.soon?" soon":""));
  if(!g.soon)a.href=g.u;
  a.appendChild(el("div","ic",g.i));a.appendChild(el("b",null,g.t));a.appendChild(el("span","d",g.d));
  var r=g.soon?"Bald":(best(g.k)?"Rekord: "+g.f(best(g.k)):"Noch kein Rekord");
  a.appendChild(el("div","rec",r));grid.appendChild(a);
});
</script>
</body>
</html>
