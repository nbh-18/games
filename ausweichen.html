<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausweichen</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:700}
#bs{color:var(--mute);font-weight:500}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
.ov.hide{display:none}
.panel{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.big.gold{color:var(--gold)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><span id="tm">0.0 s</span><span id="bs"></span></div>
<div class="ov" id="ov"><div class="panel">
  <p class="label">Ausweichen</p>
  <p class="big" id="ovBig">Bereit?</p>
  <p class="sub" id="ovSub">Ziehe mit dem Finger irgendwo auf dem Bildschirm. Das Schiff folgt deiner Bewegung. Weiche den Steinen aus.</p>
  <button class="btn" id="go">Start</button>
  <a class="back" href="index.html">← Menü</a>
</div></div>
<script>
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),tm=document.getElementById("tm"),bs=document.getElementById("bs");
var ov=document.getElementById("ov"),ovBig=document.getElementById("ovBig"),ovSub=document.getElementById("ovSub");
var KEY="game:ausweichen:best",SENS=1.25;
var W=0,H=0,unit=0,st="ready",p={x:0,y:0,r:16},stones=[],t=0,acc=0,last=0,lock=0,pid=null,lx=0,ly=0,col={bg:"#101215",stone:"#9aa3b0",accent:"#e5483d"},best=0;
try{best=parseFloat(localStorage.getItem(KEY))||0}catch(e){}
function showBest(){bs.textContent=best?"Rekord "+best.toFixed(1)+" s":""}
function fit(){
  var dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;unit=Math.min(W,H);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);clampP();draw();
}
function clampP(){p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(H*0.4,Math.min(H-p.r-H*0.04,p.y))}
function colors(){var s=getComputedStyle(document.documentElement);["bg","stone","accent"].forEach(function(k){col[k]=s.getPropertyValue("--"+k).trim()||col[k]})}
function reset(){p.r=Math.max(12,Math.min(20,unit*0.04));p.x=W/2;p.y=H*0.8;stones=[];t=0;acc=0;tm.textContent="0.0 s"}
function spawn(spd){
  var r=Math.max(11,Math.min(34,unit*(0.03+Math.random()*0.06))),pts=[],n=7;
  for(var i=0;i<n;i++)pts.push([i/n*Math.PI*2,0.75+Math.random()*0.3]);
  var x=Math.random()<0.3?p.x+(Math.random()-0.5)*70:r+Math.random()*(W-2*r);
  stones.push({x:Math.max(r,Math.min(W-r,x)),y:-r,r:r,vy:spd*H*(0.8+Math.random()*0.5),vx:(Math.random()-0.5)*unit*0.15,a:Math.random()*6,w:(Math.random()-0.5)*3,pts:pts});
}
function update(dt){
  t+=dt;
  var spd=Math.min(1.25,0.32+0.011*t),gap=Math.max(0.16,0.62-0.01*t);
  acc+=dt;while(acc>gap){acc-=gap;if(stones.length<45)spawn(spd)}
  for(var i=stones.length-1;i>=0;i--){
    var s=stones[i];s.y+=s.vy*dt;s.x+=s.vx*dt;s.a+=s.w*dt;
    if(s.y-s.r>H+10){stones.splice(i,1);continue}
    var dx=s.x-p.x,dy=s.y-p.y,rr=p.r*0.7+s.r*0.8;
    if(dx*dx+dy*dy<rr*rr){over();return}
  }
  tm.textContent=t.toFixed(1)+" s";
}
function draw(){
  ctx.fillStyle=col.bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=col.stone;
  stones.forEach(function(s){
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.beginPath();
    s.pts.forEach(function(q,i){var x=Math.cos(q[0])*s.r*q[1],y=Math.sin(q[0])*s.r*q[1];if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});
    ctx.closePath();ctx.fill();ctx.restore();
  });
  ctx.fillStyle=col.accent;ctx.beginPath();
  ctx.moveTo(p.x,p.y-p.r*1.25);ctx.lineTo(p.x+p.r,p.y+p.r);ctx.lineTo(p.x,p.y+p.r*0.55);ctx.lineTo(p.x-p.r,p.y+p.r);ctx.closePath();ctx.fill();
}
function loop(ts){
  if(st!=="play")return;
  var dt=last?Math.min(0.05,(ts-last)/1000):0;last=ts;
  update(dt);draw();
  if(st==="play")requestAnimationFrame(loop);
}
function begin(){colors();reset();st="play";last=0;ov.classList.add("hide");requestAnimationFrame(loop)}
function over(){
  st="over";pid=null;lock=Date.now()+600;draw();
  var rec=t>best;if(rec){best=Math.round(t*10)/10;try{localStorage.setItem(KEY,String(best))}catch(e){}}
  showBest();
  ovBig.textContent=t.toFixed(1)+" s";ovBig.className="big"+(rec?" gold":"");
  ovSub.textContent=rec?"Neuer Rekord!":"Rekord: "+best.toFixed(1)+" s";
  document.getElementById("go").textContent="Nochmal";ov.classList.remove("hide");
}
document.getElementById("go").addEventListener("click",function(){if(Date.now()>=lock)begin()});
cv.addEventListener("pointerdown",function(e){
  if(st!=="play"||pid!==null)return;e.preventDefault();pid=e.pointerId;lx=e.clientX;ly=e.clientY;
  try{cv.setPointerCapture(pid)}catch(_){}
});
cv.addEventListener("pointermove",function(e){
  if(e.pointerId!==pid||st!=="play")return;e.preventDefault();
  p.x+=(e.clientX-lx)*SENS;p.y+=(e.clientY-ly)*SENS;lx=e.clientX;ly=e.clientY;clampP();
});
function endp(e){if(e.pointerId===pid)pid=null}
cv.addEventListener("pointerup",endp);cv.addEventListener("pointercancel",endp);
document.addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});
window.addEventListener("resize",fit);window.addEventListener("orientationchange",fit);
colors();fit();reset();draw();showBest();
</script>
</body>
</html>
