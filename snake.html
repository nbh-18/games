<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link rel="stylesheet" href="base.css">
<style>#cv{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud"><span id="sc">0</span></div>
<script src="game.js"></script>
<script>
G.setup({title:"Snake",rules:"Wische in die Richtung, in die die Schlange laufen soll. Friss Äpfel, aber berühre weder Wand noch dich selbst.",key:"game:snake:best",fmt:function(v){return v+" Äpfel"}});
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),sc=document.getElementById("sc");
var cols=15,W=0,H=0,cell=20,ox=0,oy=64,rows=20,snake=[],dir={x:1,y:0},queue=[],food={x:0,y:0},acc=0,step=0.15,score=0,run=false,last=0,sx=0,sy=0,pid=null,C={bg:"#101215",accent:"#e5483d",ok:"#2fd27a",line:"#262a31"};
function fit(){var d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cell=Math.floor(W/cols);ox=Math.floor((W-cell*cols)/2);rows=Math.max(8,Math.floor((H-oy-28)/cell));cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(!run)draw()}
function rnd(n){return Math.floor(Math.random()*n)}
function place(){do{food={x:rnd(cols),y:rnd(rows)}}while(snake.some(function(s){return s.x===food.x&&s.y===food.y}))}
function begin(){
  var s=getComputedStyle(document.documentElement);for(var k in C)C[k]=s.getPropertyValue("--"+k).trim()||C[k];
  snake=[{x:5,y:rows>>1},{x:4,y:rows>>1},{x:3,y:rows>>1}];dir={x:1,y:0};queue=[];score=0;sc.textContent="0";step=0.15;acc=0;place();run=true;last=0;requestAnimationFrame(loop);
}
function tick(){
  if(queue.length)dir=queue.shift();
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||snake.slice(0,-1).some(function(s){return s.x===h.x&&s.y===h.y})){run=false;draw();G.end(score,"");return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;sc.textContent=score;step=Math.max(0.07,step-0.003);place()}else snake.pop();
}
function loop(ts){
  if(!run)return;var dt=last?Math.min(0.05,(ts-last)/1000):0;last=ts;
  acc+=dt;while(acc>=step&&run){acc-=step;tick()}
  draw();if(run)requestAnimationFrame(loop);
}
function draw(){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.strokeRect(ox,oy,cell*cols,cell*rows);
  ctx.fillStyle=C.ok;ctx.beginPath();ctx.arc(ox+(food.x+0.5)*cell,oy+(food.y+0.5)*cell,cell*0.36,0,7);ctx.fill();
  snake.forEach(function(s,i){ctx.globalAlpha=i?0.75:1;ctx.fillStyle=C.accent;ctx.fillRect(ox+s.x*cell+1,oy+s.y*cell+1,cell-2,cell-2)});
  ctx.globalAlpha=1;
}
cv.addEventListener("pointerdown",function(e){if(!run||pid!==null)return;e.preventDefault();pid=e.pointerId;sx=e.clientX;sy=e.clientY;try{cv.setPointerCapture(pid)}catch(_){}});
cv.addEventListener("pointermove",function(e){
  if(e.pointerId!==pid||!run)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  var d=Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1},ref=queue.length?queue[queue.length-1]:dir;
  if(!(d.x===-ref.x&&d.y===-ref.y)&&!(d.x===ref.x&&d.y===ref.y)&&queue.length<2)queue.push(d);
  sx=e.clientX;sy=e.clientY;
});
function endp(e){if(e.pointerId===pid)pid=null}
cv.addEventListener("pointerup",endp);cv.addEventListener("pointercancel",endp);
window.addEventListener("resize",fit);
G.onStart(begin);fit();
</script>
</body>
</html>
